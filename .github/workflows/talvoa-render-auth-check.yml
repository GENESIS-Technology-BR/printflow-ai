name: TALVOA Render API Authentication Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-auth:
    runs-on: ubuntu-latest
    environment: supritech-homolog-audit
    timeout-minutes: 4
    steps:
      - name: Validate Render key against homologation database (read-only)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY not present in environment secrets"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url='https://api.render.com/v1/postgres/dpg-db7rsb25b2lc739g0img-a'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['RENDER_API_KEY'],'Accept':'application/json'},method='GET')
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=json.load(response)
              if data.get('id')!='dpg-db7rsb25b2lc739g0img-a':
                  raise RuntimeError('Unexpected database identity')
              print('PASS: Render API authenticated and homologation database identity verified (read-only).')
          except urllib.error.HTTPError as exc:
              print(f'FAIL: Render API HTTP {exc.code}; no changes performed.')
              raise SystemExit(1)
          except Exception as exc:
              print(f'FAIL: {type(exc).__name__}; no changes performed.')
              raise SystemExit(1)
          PY
