name: SupriTech read-only account audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supritech-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    # Dedicated runner on an authorized network. Never use github-hosted runners
    # or broaden the PostgreSQL IP allowlist for this workflow.
    runs-on: [self-hosted, linux, x64, talvoa-db-audit]
    timeout-minutes: 8
    environment: supritech-homolog-audit
    steps:
      - name: Checkout audit scripts
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg2-binary>=2.9,<3.0'
      - name: Verify database secret
        env:
          AUDIT_DATABASE_URL: ${{ secrets.SUPRITECH_AUDIT_DATABASE_URL }}
        run: |
          if [ -z "$AUDIT_DATABASE_URL" ]; then
            echo "::error::SUPRITECH_AUDIT_DATABASE_URL is not configured."
            exit 1
          fi
      - name: Run read-only inventory
        env:
          DATABASE_URL: ${{ secrets.SUPRITECH_AUDIT_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '8'
        run: python ops/audit_supritech_accounts.py
