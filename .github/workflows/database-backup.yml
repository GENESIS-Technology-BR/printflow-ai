name: TALVOA Database Backup

on:
  workflow_dispatch:
  schedule:
    # 05:00 UTC = 02:00 America/Sao_Paulo (UTC-3)
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/database-backup.yml"
      - ".github/workflows/supabase-restore.yml"

permissions:
  contents: read

concurrency:
  group: talvoa-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup logico PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGDATABASE: postgres
      BACKUP_DIR: backup-output

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar sintaxe do workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/database-backup.yml").read_text(encoding="utf-8")
          assert 'cron: "0 5 * * *"' in text
          assert "actions/upload-artifact@" in text
          assert "TALVOA-DB-Daily-" in text
          assert "retention-days: 7" in text
          assert "TALVOA-DB-Weekly-" in text
          assert "retention-days: 28" in text
          assert "TALVOA-DB-Monthly-" in text
          assert "retention-days: 90" in text
          print("Contrato do workflow de backup TALVOA validado.")
          PY

      - name: Verificar configuracao segura
        shell: bash
        env:
          TALVOA_DB_PASSWORD: ${{ secrets.TALVOA_SUPABASE_DATABASE_PASSWORD || secrets.PRINTFLOW_SUPABASE_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TALVOA_DB_PASSWORD:-}" ]]; then
            echo "::error::Senha do banco TALVOA ainda nao configurada no GitHub Secrets. Nenhum acesso ao banco foi realizado."
            exit 1
          fi
          echo "Configuracao segura do Supabase presente. Valor protegido e nao exibido."

      - name: Instalar cliente PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Gerar backup logico somente leitura
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.TALVOA_SUPABASE_DATABASE_PASSWORD || secrets.PRINTFLOW_SUPABASE_DATABASE_PASSWORD }}
          PGHOST: aws-0-ca-central-1.pooler.supabase.com
          PGPORT: "5432"
          PGUSER: postgres.glnmlfwtuqqngfiqsqow
          PGSSLMODE: require
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR"
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          file="$BACKUP_DIR/talvoa-supabase-$stamp.dump"
          pg_dump \
            --dbname="$PGDATABASE" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            --file="$file"
          test -s "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"

      - name: Validar integridade estrutural
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BACKUP_FILE"
          pg_restore --list "$BACKUP_FILE" > /tmp/restore-list.txt
          test -s /tmp/restore-list.txt
          sha256sum "$BACKUP_FILE" | tee "$BACKUP_FILE.sha256"
          bytes="$(stat -c%s "$BACKUP_FILE")"
          objects="$(grep -cv '^;' /tmp/restore-list.txt || true)"
          {
            echo "## TALVOA Database Backup #${{ github.run_number }}"
            echo "- Status da geracao: **validado**"
            echo "- Banco: \`Supabase PostgreSQL\`"
            echo "- Cliente PostgreSQL: \`18\`"
            echo "- Formato: PostgreSQL custom dump"
            echo "- Tamanho: \`${bytes}\` bytes"
            echo "- Objetos catalogados: \`${objects}\`"
            echo "- SHA-256: **gerado**"
            echo "- Credenciais: **nao exibidas**"
            echo "- Destino de retencao: **GitHub Actions Artifacts**"
            echo "- Backup armazenado: **criptografado (AES-256 + PBKDF2)**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Provar restaurabilidade em PostgreSQL efemero isolado
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name talvoa-dr \
            -e POSTGRES_PASSWORD=talvoa_dr_local \
            -e POSTGRES_DB=talvoa_dr \
            postgres:18-alpine
          trap 'docker rm -f talvoa-dr >/dev/null 2>&1 || true' EXIT

          ready=0
          for i in {1..60}; do
            if [[ "$(docker inspect -f '{{.State.Running}}' talvoa-dr 2>/dev/null || true)" != "true" ]]; then
              echo "::error::Container PostgreSQL DR encerrou antes de ficar pronto."
              docker logs talvoa-dr || true
              exit 1
            fi
            if docker exec -e PGPASSWORD=talvoa_dr_local talvoa-dr \
              psql -h 127.0.0.1 -U postgres -d talvoa_dr -X -A -t -v ON_ERROR_STOP=1 \
              -c "select 1" 2>/dev/null | grep -qx "1"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            echo "::error::PostgreSQL DR nao ficou pronto dentro do prazo."
            docker logs talvoa-dr || true
            exit 1
          fi

          pg_restore --list "$BACKUP_FILE" | awk '
            /^;/ { print; next }
            / (TABLE|TABLE DATA|SEQUENCE|SEQUENCE SET|CONSTRAINT|INDEX|FK CONSTRAINT|TRIGGER) public / { print }
          ' > /tmp/dr-restore-list.txt
          test -s /tmp/dr-restore-list.txt

          docker cp "$BACKUP_FILE" talvoa-dr:/tmp/talvoa.dump
          docker cp /tmp/dr-restore-list.txt talvoa-dr:/tmp/dr-restore-list.txt

          docker exec -e PGPASSWORD=talvoa_dr_local talvoa-dr \
            pg_restore \
              --host=127.0.0.1 \
              --username=postgres \
              --dbname=talvoa_dr \
              --no-owner \
              --no-privileges \
              --exit-on-error \
              --use-list=/tmp/dr-restore-list.txt \
              /tmp/talvoa.dump

          table_count="$(docker exec -e PGPASSWORD=talvoa_dr_local talvoa-dr \
            psql -h 127.0.0.1 -U postgres -d talvoa_dr -X -A -t -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")"
          if [[ ! "$table_count" =~ ^[0-9]+$ ]] || (( table_count < 7 )); then
            echo "::error::Restore DR incompleto: $table_count tabelas publicas."
            docker logs talvoa-dr || true
            exit 1
          fi
          usage_count="$(docker exec -e PGPASSWORD=talvoa_dr_local talvoa-dr \
            psql -h 127.0.0.1 -U postgres -d talvoa_dr -X -A -t -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM public.printer_usage_daily;")"
          alert_count="$(docker exec -e PGPASSWORD=talvoa_dr_local talvoa-dr \
            psql -h 127.0.0.1 -U postgres -d talvoa_dr -X -A -t -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM public.operational_alerts;")"
          checksum="$(awk '{print $1}' "$BACKUP_FILE.sha256")"
          bytes="$(stat -c%s "$BACKUP_FILE")"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > "$BACKUP_DIR/backup-evidence.json" <<EOF
          {
            "run_number": ${{ github.run_number }},
            "run_id": ${{ github.run_id }},
            "created_utc": "$now",
            "database": "supabase-postgres",
            "backup_bytes": $bytes,
            "sha256": "$checksum",
            "structural_validation": "ok",
            "storage": "github-actions-artifacts",
            "dr_restore": "ok",
            "dr_mode": "ephemeral-postgresql-18",
            "dr_public_tables": $table_count,
            "dr_usage_rows": $usage_count,
            "dr_alert_rows": $alert_count,
            "production_used_as_restore_target": false
          }
          EOF
          {
            echo "- Restore automatico DR: **VALIDADO em PostgreSQL 18 efemero**"
            echo "- Tabelas restauradas: `$table_count`"
            echo "- Historicos restaurados: `$usage_count`"
            echo "- Alertas restaurados: `$alert_count`"
            echo "- Producao usada como destino: **nao**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Criptografar backup antes do armazenamento no GitHub
        shell: bash
        env:
          TALVOA_BACKUP_ENCRYPTION_KEY: ${{ secrets.TALVOA_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TALVOA_BACKUP_ENCRYPTION_KEY:-}" ]]; then
            echo "::error::Secret TALVOA_BACKUP_ENCRYPTION_KEY nao configurado. O dump nao sera publicado sem criptografia."
            exit 1
          fi

          encrypted="${BACKUP_FILE}.enc"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000             -in "$BACKUP_FILE"             -out "$encrypted"             -pass env:TALVOA_BACKUP_ENCRYPTION_KEY

          test -s "$encrypted"
          sha256sum "$encrypted" | tee "$encrypted.sha256"
          echo "UPLOAD_BACKUP_FILE=$encrypted" >> "$GITHUB_ENV"

      - name: Classificar retencao do backup
        id: retention
        shell: bash
        run: |
          set -euo pipefail
          day_of_week="$(date -u +'%u')"
          day_of_month="$(date -u +'%d')"

          echo "is_weekly=false" >> "$GITHUB_OUTPUT"
          echo "is_monthly=false" >> "$GITHUB_OUTPUT"

          if [[ "$day_of_week" == "7" ]]; then
            echo "is_weekly=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$day_of_month" == "01" ]]; then
            echo "is_monthly=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar evidencia de auditoria
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: TALVOA-DB-Evidence-${{ github.run_number }}
          path: ${{ env.BACKUP_DIR }}/backup-evidence.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publicar backup diario
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v5
        with:
          name: TALVOA-DB-Daily-${{ github.run_number }}
          path: |
            ${{ env.UPLOAD_BACKUP_FILE }}
            ${{ env.UPLOAD_BACKUP_FILE }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Publicar backup semanal
        if: ${{ steps.retention.outputs.is_weekly == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: TALVOA-DB-Weekly-${{ github.run_number }}
          path: |
            ${{ env.UPLOAD_BACKUP_FILE }}
            ${{ env.UPLOAD_BACKUP_FILE }}.sha256
          if-no-files-found: error
          retention-days: 28
          compression-level: 9

      - name: Publicar backup mensal
        if: ${{ steps.retention.outputs.is_monthly == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: TALVOA-DB-Monthly-${{ github.run_number }}
          path: |
            ${{ env.UPLOAD_BACKUP_FILE }}
            ${{ env.UPLOAD_BACKUP_FILE }}.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Registrar politica de retencao
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          {
            echo "- Destino: **GitHub Actions Artifacts**"
            echo "- Backup diario: **7 dias**"
            echo "- Backup semanal (domingo): **28 dias**"
            echo "- Backup mensal (dia 1): **90 dias (limite do repositório público)**"
            echo "- Restore homologado: **sim, em PostgreSQL efemero isolado**"
            echo "- Armazenamento externo adicional: **nao utilizado nesta fase**"
            echo "- Observacao: **6 meses exigem repositorio privado de backup ou outro destino seguro**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar arquivos locais do runner
        if: always()
        shell: bash
        run: rm -rf "$BACKUP_DIR" /tmp/restore-list.txt /tmp/dr-restore-list.txt
