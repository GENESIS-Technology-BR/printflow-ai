name: PRINTFLOW Database Backup

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Publicar copia temporaria como artifact do GitHub (homologacao apenas)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: printflow-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup logico PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGDATABASE: neondb
      BACKUP_DIR: backup-output

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verificar configuracao segura
        shell: bash
        env:
          PRINTFLOW_BACKUP_DATABASE_URL: ${{ secrets.PRINTFLOW_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${PRINTFLOW_BACKUP_DATABASE_URL:-}" ]]; then
            echo "::error::Secret PRINTFLOW_BACKUP_DATABASE_URL ainda nao configurado. Nenhum acesso ao banco foi realizado."
            exit 1
          fi
          case "$PRINTFLOW_BACKUP_DATABASE_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "::error::A credencial de backup nao possui formato PostgreSQL valido."; exit 1 ;;
          esac
          echo "Configuracao de backup presente. Valor protegido e nao exibido."

      - name: Instalar cliente PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Gerar backup logico somente leitura
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PRINTFLOW_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR"
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          file="$BACKUP_DIR/printflow-neondb-$stamp.dump"
          pg_dump \
            --dbname="$DATABASE_URL" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            --file="$file"
          test -s "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"

      - name: Validar integridade estrutural
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BACKUP_FILE"
          pg_restore --list "$BACKUP_FILE" > /tmp/restore-list.txt
          test -s /tmp/restore-list.txt
          sha256sum "$BACKUP_FILE" | tee "$BACKUP_FILE.sha256"
          bytes="$(stat -c%s "$BACKUP_FILE")"
          objects="$(grep -cv '^;' /tmp/restore-list.txt || true)"
          {
            echo "## PRINTFLOW Database Backup #${{ github.run_number }}"
            echo "- Status da geracao: **validado**"
            echo "- Banco: \`neondb\`"
            echo "- Cliente PostgreSQL: \`18\`"
            echo "- Formato: PostgreSQL custom dump"
            echo "- Tamanho: \`${bytes}\` bytes"
            echo "- Objetos catalogados: \`${objects}\`"
            echo "- Credenciais: **nao exibidas**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact temporario para homologacao
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: PRINTFLOW-DB-Backup-${{ github.run_number }}
          path: |
            ${{ env.BACKUP_FILE }}
            ${{ env.BACKUP_FILE }}.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Bloquear falsa sensacao de backup externo
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          echo "::warning::Dump validado, mas o destino externo independente ainda nao foi configurado."
          echo "Backup externo permanente: PENDENTE" >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar arquivos locais do runner
        if: always()
        shell: bash
        run: rm -rf "$BACKUP_DIR" /tmp/restore-list.txt
