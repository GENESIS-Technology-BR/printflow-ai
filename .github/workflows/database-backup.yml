name: PRINTFLOW Database Backup

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Publicar copia como artifact do GitHub"
        required: false
        default: true
        type: boolean
  schedule:
    # 05:00 UTC = 02:00 America/Sao_Paulo (UTC-3)
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/database-backup.yml"
      - ".github/workflows/supabase-restore.yml"

permissions:
  contents: read

concurrency:
  group: printflow-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup logico PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGDATABASE: postgres
      BACKUP_DIR: backup-output

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar sintaxe do workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/database-backup.yml").read_text(encoding="utf-8")
          assert 'cron: "0 5 * * *"' in text
          assert "actions/upload-artifact@v5" in text
          assert "normalize_pg_target" in text
          print("Contrato do workflow de backup validado.")
          PY

      - name: Verificar configuracao segura
        shell: bash
        env:
          PRINTFLOW_SUPABASE_DATABASE_URL: ${{ secrets.PRINTFLOW_SUPABASE_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${PRINTFLOW_SUPABASE_DATABASE_URL:-}" ]]; then
            echo "::error::Secret PRINTFLOW_SUPABASE_DATABASE_URL ainda nao configurado. Nenhum acesso ao banco foi realizado."
            exit 1
          fi
          echo "Configuracao segura do Supabase presente. Valor protegido e nao exibido."

      - name: Instalar cliente PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Gerar backup logico somente leitura
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.PRINTFLOW_SUPABASE_DATABASE_PASSWORD }}
          PGHOST: aws-0-ca-central-1.pooler.supabase.com
          PGPORT: "5432"
          PGUSER: postgres.glnmlfwtuqqngfiqsqow
          PGSSLMODE: require
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR"
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          file="$BACKUP_DIR/printflow-supabase-$stamp.dump"
          pg_dump \
            --dbname="$PGDATABASE" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            --file="$file"
          test -s "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"

      - name: Validar integridade estrutural
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BACKUP_FILE"
          pg_restore --list "$BACKUP_FILE" > /tmp/restore-list.txt
          test -s /tmp/restore-list.txt
          sha256sum "$BACKUP_FILE" | tee "$BACKUP_FILE.sha256"
          bytes="$(stat -c%s "$BACKUP_FILE")"
          objects="$(grep -cv '^;' /tmp/restore-list.txt || true)"
          {
            echo "## PRINTFLOW Database Backup #${{ github.run_number }}"
            echo "- Status da geracao: **validado**"
            echo "- Banco: \`Supabase PostgreSQL\`"
            echo "- Cliente PostgreSQL: \`18\`"
            echo "- Formato: PostgreSQL custom dump"
            echo "- Tamanho: \`${bytes}\` bytes"
            echo "- Objetos catalogados: \`${objects}\`"
            echo "- SHA-256: **gerado**"
            echo "- Credenciais: **nao exibidas**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Copiar backup para Google Drive
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.PRINTFLOW_GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PRINTFLOW_GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.PRINTFLOW_GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Credencial Google Drive ausente: $name"
              exit 1
            fi
          done

          token_body="$(mktemp)"
          token_http="$(curl --silent --show-error --output "$token_body" --write-out '%{http_code}' -X POST https://oauth2.googleapis.com/token --data-urlencode "client_id=$GOOGLE_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" --data-urlencode "grant_type=refresh_token")"
          if [[ "$token_http" != "200" ]]; then
            oauth_error="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(str(d.get("error","erro_desconhecido")) + (": " + str(d.get("error_description","")) if d.get("error_description") else ""))' "$token_body" 2>/dev/null || echo resposta_invalida)"
            rm -f "$token_body"
            echo "::error::Google OAuth recusou a renovacao do token (HTTP $token_http): $oauth_error"
            echo "Nenhuma credencial OAuth foi exibida."
            exit 1
          fi
          access_token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("access_token", ""))' "$token_body")"
          rm -f "$token_body"
          if [[ -z "$access_token" ]]; then
            echo "::error::Google OAuth respondeu HTTP 200, mas nao retornou access token."
            exit 1
          fi
          echo "::add-mask::$access_token"
          echo "Google OAuth autenticado com sucesso."

          upload_drive() {
            local file="$1"
            local mime="$2"
            local name
            name="$(basename "$file")"
            local metadata response id
            metadata="$(python3 -c 'import json,sys; print(json.dumps({"name": sys.argv[1]}))' "$name")"
            response="$(curl --fail-with-body --silent --show-error -X POST 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name' -H "Authorization: Bearer $access_token" -F "metadata=$metadata;type=application/json;charset=UTF-8" -F "file=@$file;type=$mime")"
            id="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))' <<< "$response")"
            if [[ -z "$id" ]]; then
              echo "::error::Google Drive nao confirmou upload de $name."
              exit 1
            fi
            echo "Google Drive confirmou upload de $name (ID protegido do log operacional)."
          }

          upload_drive "$BACKUP_FILE" application/octet-stream
          upload_drive "$BACKUP_FILE.sha256" text/plain
          {
            echo "- Copia externa Google Drive: **confirmada**"
            echo "- Escopo OAuth: \`drive.file\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Provar restaurabilidade em PostgreSQL efemero isolado
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name printflow-dr \
            -e POSTGRES_PASSWORD=printflow_dr_local \
            -e POSTGRES_DB=printflow_dr \
            -p 55432:5432 postgres:18-alpine
          trap 'docker rm -f printflow-dr >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if docker exec printflow-dr pg_isready -U postgres -d printflow_dr >/dev/null 2>&1; then break; fi
            sleep 1
          done
          export PGPASSWORD=printflow_dr_local
          DR_URL="postgresql://postgres@127.0.0.1:55432/printflow_dr"
          pg_restore --list "$BACKUP_FILE" | awk '
            /^;/ { print; next }
            / (TABLE|TABLE DATA|SEQUENCE|SEQUENCE SET|CONSTRAINT|INDEX|FK CONSTRAINT|TRIGGER) public / { print }
          ' > /tmp/dr-restore-list.txt
          test -s /tmp/dr-restore-list.txt
          pg_restore --dbname="$DR_URL" --no-owner --no-privileges --exit-on-error --use-list=/tmp/dr-restore-list.txt "$BACKUP_FILE"
          table_count="$(psql "$DR_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")"
          if [[ ! "$table_count" =~ ^[0-9]+$ ]] || (( table_count < 7 )); then
            echo "::error::Restore DR incompleto: $table_count tabelas publicas."
            exit 1
          fi
          usage_count="$(psql "$DR_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.printer_usage_daily;")"
          alert_count="$(psql "$DR_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.operational_alerts;")"
          checksum="$(awk '{print $1}' "$BACKUP_FILE.sha256")"
          bytes="$(stat -c%s "$BACKUP_FILE")"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > "$BACKUP_DIR/backup-evidence.json" <<EOF
          {
            "run_number": ${{ github.run_number }},
            "run_id": ${{ github.run_id }},
            "created_utc": "$now",
            "database": "supabase-postgres",
            "backup_bytes": $bytes,
            "sha256": "$checksum",
            "structural_validation": "ok",
            "google_drive_copy": "ok",
            "dr_restore": "ok",
            "dr_mode": "ephemeral-postgresql-18",
            "dr_public_tables": $table_count,
            "dr_usage_rows": $usage_count,
            "dr_alert_rows": $alert_count,
            "production_used_as_restore_target": false
          }
          EOF
          {
            echo "- Restore automatico DR: **VALIDADO em PostgreSQL 18 efemero**"
            echo "- Tabelas restauradas: `$table_count`"
            echo "- Historicos restaurados: `$usage_count`"
            echo "- Alertas restaurados: `$alert_count`"
            echo "- Producao usada como destino: **nao**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar evidencia de auditoria
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: PRINTFLOW-DB-Evidence-${{ github.run_number }}
          path: ${{ env.BACKUP_DIR }}/backup-evidence.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publicar backup com retencao
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.upload_artifact) }}
        uses: actions/upload-artifact@v5
        with:
          name: PRINTFLOW-DB-Backup-${{ github.run_number }}
          path: |
            ${{ env.BACKUP_FILE }}
            ${{ env.BACKUP_FILE }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Registrar protecao automatica
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          {
            echo "- Execucao: **automatica diaria**"
            echo "- Retencao do artifact: **14 dias**"
            echo "- Restore homologado: **sim, em PostgreSQL efemero isolado**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar arquivos locais do runner
        if: always()
        shell: bash
        run: rm -rf "$BACKUP_DIR" /tmp/restore-list.txt /tmp/dr-restore-list.txt
