name: Validate PRINTFLOW v0.4.4

on:
  push:
    branches:
      - feature/v0.4.4-costs
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Testes backend e agent
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/agent/python
        run: python -m pytest -q agent/python/tests backend/tests

      - name: Compilacao Python
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/modules/usage/reporting.py
          python -m py_compile backend/modules/usage/router.py
          python -m py_compile backend/modules/printers/router.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
