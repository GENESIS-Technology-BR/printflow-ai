name: Partner tenancy validation

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'requirements.txt'
      - '.github/workflows/partner-tenancy.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./partner-ci.sqlite3
      ENVIRONMENT: development
      SECRET_KEY: ci-only-not-for-production-change-me
      JWT_SECRET: ci-only-not-for-production-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest backend/tests/test_partner_access.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
