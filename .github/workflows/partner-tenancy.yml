name: Partner tenancy validation

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'requirements.txt'
      - 'tests/**'
      - 'backend/scripts/migrate_supritech_homolog_structure.py'
      - '.github/workflows/partner-tenancy.yml'
      - '.github/workflows/homolog-migration-safety.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./partner-ci.sqlite3
      ENVIRONMENT: development
      SECRET_KEY: ci-only-not-for-production-change-me
      JWT_SECRET: ci-only-not-for-production-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q backend
      - name: Run migration safety regression tests
        run: python -m unittest discover -s tests -p 'test_homolog_migration_safety.py' -v
      - run: python -m pytest backend/tests/test_partner_access.py backend/tests/test_partner_http.py backend/tests/test_integration_scoped_keys.py backend/tests/test_health_endpoints.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'security/vite-8-2-4-supritech' && github.head_ref || github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate Vite lockfile for isolated security PR
        if: github.event_name == 'pull_request' && github.head_ref == 'security/vite-8-2-4-supritech'
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Audit high and critical vulnerabilities in isolated security PR
        if: github.event_name == 'pull_request' && github.head_ref == 'security/vite-8-2-4-supritech'
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Commit verified lockfile to isolated security branch
        if: github.event_name == 'pull_request' && github.head_ref == 'security/vite-8-2-4-supritech' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SECURITY_BRANCH: security/vite-8-2-4-supritech
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security(frontend): persist audited Vite 8.2.4 lockfile'
            git push origin HEAD:$SECURITY_BRANCH
          fi
      - name: Export regenerated lockfile for review (no deploy)
        if: github.event_name == 'pull_request' && github.head_ref == 'security/vite-8-2-4-supritech'
        uses: actions/upload-artifact@v4
        with:
          name: supritech-vite-8-2-4-lockfile
          path: frontend/package-lock.json
          retention-days: 7
