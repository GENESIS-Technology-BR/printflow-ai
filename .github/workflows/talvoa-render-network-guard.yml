name: TALVOA Render Network Guard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/talvoa-render-network-guard.yml'
permissions:
  contents: read
concurrency:
  group: talvoa-render-network-guard
  cancel-in-progress: false
jobs:
  read-only:
    runs-on: ubuntu-latest
    environment: supritech-homolog-audit
    timeout-minutes: 4
    steps:
      - name: Verify Render allowlist without changing access
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, ipaddress, json, urllib.request
          key=os.getenv('RENDER_API_KEY')
          if not key:
              raise SystemExit('BLOCKED: RENDER_API_KEY not configured in environment')
          request=urllib.request.Request(
              'https://api.render.com/v1/postgres/dpg-db7rsb25b2lc739g0img-a',
              headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
          with urllib.request.urlopen(request,timeout=20) as response:
              data=json.load(response)
          assert data['id']=='dpg-db7rsb25b2lc739g0img-a', 'Wrong database ID'
          rows=data.get('ipAllowList',[])
          for entry in rows:
              net=ipaddress.ip_network(entry['cidrBlock'],strict=False)
              if net.prefixlen==0:
                  raise SystemExit('BLOCKED: Database is publicly open')
          stale=[x for x in rows if x.get('description')=='talvoa-ephemeral-gh-backup']
          if stale:
              raise SystemExit('BLOCKED: stale TALVOA temporary IP rule; inspect Render Networking')
          print('PASS: Render homologation identity and network policy verified; no changes made')
          print('Allowlist entries:',len(rows))
          PY
