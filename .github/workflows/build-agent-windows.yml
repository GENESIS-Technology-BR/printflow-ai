name: Build PRINTFLOW Agent Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "agent/python/**"
      - "agent/windows/**"
      - ".github/workflows/build-agent-windows.yml"
      - "requirements.txt"
      - "requirements-dev.txt"

permissions:
  contents: read

concurrency:
  group: printflow-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-agent:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller pip-audit

      - name: Executar testes automatizados
        shell: powershell
        run: |
          $env:PYTHONPATH = "${{ github.workspace }};${{ github.workspace }}/agent/python"
          python -m pytest -q agent/python/tests backend/tests

      - name: Auditar dependencias Python
        shell: powershell
        run: pip-audit -r requirements.txt

      - name: Gate de seguranca frontend
        shell: powershell
        run: |
          Push-Location frontend
          npm ci
          npm audit --audit-level=high
          Pop-Location

      - name: Validar scripts Windows
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem agent/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            throw "Foram encontrados erros nos scripts PowerShell."
          }

      - name: Validar contratos operacionais do Agent
        shell: powershell
        run: |
          $env:PYTHONPATH = "${{ github.workspace }};${{ github.workspace }}/agent/python"
          python -m pytest -q agent/python/tests
          Select-String -Path agent/python/**/*.py -Pattern "heartbeat|page_count|serial|snmp" -Quiet | Out-Null
          if (-not $?) { throw "Contratos essenciais do Agent nao foram encontrados." }

      - name: Validar Agent oficial
        shell: powershell
        run: |
          python -m py_compile agent/python/main.py
          python -m py_compile agent/python/config/settings.py
          python -m py_compile agent/python/core/service.py
          python -m py_compile agent/python/core/scheduler.py
          python -m py_compile agent/python/network_manager.py
          python -m py_compile agent/python/discovery_runner.py
          python -m py_compile agent/python/snmp/engine.py
          python -m py_compile agent/python/api/client.py

      - name: Gerar executável oficial
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name PRINTFLOW-Agent `
            --paths agent/python `
            --hidden-import pysnmp `
            --hidden-import pysnmp.hlapi `
            --hidden-import pysnmp.hlapi.v3arch `
            --hidden-import pysnmp.hlapi.v3arch.asyncio `
            --collect-all pysnmp `
            --collect-submodules pysnmp `
            --collect-all pyasn1 `
            --collect-submodules pyasn1 `
            --hidden-import psutil `
            --hidden-import requests `
            --hidden-import config.settings `
            --hidden-import core.logger `
            --hidden-import core.scheduler `
            --hidden-import core.service `
            --hidden-import api.client `
            --hidden-import snmp.engine `
            --hidden-import snmp.oids `
            --hidden-import diagnostic_robot `
            --hidden-import intelligence `
            --hidden-import intelligence.printer_v3 `
            agent/python/main.py

      - name: Testar executável oficial
        shell: powershell
        run: |
          & dist/PRINTFLOW-Agent.exe --help | Tee-Object -FilePath EXE-SMOKE-TEST.txt
          if ($LASTEXITCODE -ne 0) { throw "O executavel falhou no teste --help. Codigo: $LASTEXITCODE" }
          $help = Get-Content EXE-SMOKE-TEST.txt -Raw
          if ($help -notmatch "--network" -or $help -notmatch "--daemon") { throw "O executavel nao apresentou as opcoes obrigatorias." }

      - name: Montar pacote oficial de teste
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item dist/PRINTFLOW-Agent.exe package/
          Copy-Item agent/windows/Executar-PRINTFLOW-Agent.bat package/
          Copy-Item agent/windows/INSTALAR-PRINTFLOW-Agent.bat package/
          Copy-Item agent/windows/ATUALIZAR-PRINTFLOW-Agent.bat package/
          Copy-Item agent/windows/Start-PRINTFLOW-Agent.ps1 package/
          Copy-Item agent/windows/Watchdog-PRINTFLOW-Agent.ps1 package/
          Copy-Item agent/windows/Sync-PRINTFLOW-Watchdog.ps1 package/
          Copy-Item agent/windows/Install-PRINTFLOW-Agent.ps1 package/
          Copy-Item agent/windows/Update-PRINTFLOW-Agent.ps1 package/
          Copy-Item agent/windows/Uninstall-PRINTFLOW-Agent.ps1 package/
          Copy-Item agent/windows/VALIDAR-PRINTFLOW-Build.bat package/
          Copy-Item agent/windows/Validar-PRINTFLOW-Build.ps1 package/
          Copy-Item agent/windows/README-TESTE.txt package/
          $env:PYTHONPATH = "${{ github.workspace }}/agent/python"
          $agentVersion = (python -c "from version import AGENT_VERSION; print(AGENT_VERSION)").Trim()
          $exeHash = (Get-FileHash package/PRINTFLOW-Agent.exe -Algorithm SHA256).Hash
          $required = @(
            "PRINTFLOW-Agent.exe",
            "Executar-PRINTFLOW-Agent.bat",
            "INSTALAR-PRINTFLOW-Agent.bat",
            "ATUALIZAR-PRINTFLOW-Agent.bat",
            "Start-PRINTFLOW-Agent.ps1",
            "Watchdog-PRINTFLOW-Agent.ps1",
            "Sync-PRINTFLOW-Watchdog.ps1",
            "Install-PRINTFLOW-Agent.ps1",
            "Update-PRINTFLOW-Agent.ps1",
            "Uninstall-PRINTFLOW-Agent.ps1",
            "VALIDAR-PRINTFLOW-Build.bat",
            "Validar-PRINTFLOW-Build.ps1",
            "BUILD-VALIDATION.txt",
            "README-TESTE.txt"
          )
          @(
            "PRINTFLOW OFFICIAL AGENT BUILD VALIDATION"
            "Build: ${{ github.run_number }}"
            "Version: $agentVersion"
            "Commit: $env:GITHUB_SHA"
            "Architecture: agent/python (official)"
            "Automated tests: APPROVED"
            "Official Agent compile: APPROVED"
            "PowerShell syntax: APPROVED"
            "EXE smoke test: APPROVED"
            "EXE SHA256: $exeHash"
          ) | Set-Content package/BUILD-VALIDATION.txt -Encoding UTF8
          foreach ($file in $required) {
            if (-not (Test-Path "package/$file")) { throw "Arquivo ausente no pacote: $file" }
          }
          Compress-Archive -Path package/* -DestinationPath PRINTFLOW-Agent-Windows-Teste.zip

      - name: Publicar pacote
        uses: actions/upload-artifact@v5
        with:
          name: PRINTFLOW-Agent-Windows-Build-${{ github.run_number }}
          path: PRINTFLOW-Agent-Windows-Teste.zip
          retention-days: 15

      - name: Resumo visível do build
        if: always()
        shell: bash
        run: |
          echo "## PRINTFLOW Agent Build #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Arquitetura: **agent/python (oficial)**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
