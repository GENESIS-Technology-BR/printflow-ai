name: Build PRINTFLOW Agent Windows

env:
  PRINTFLOW_BUILD_NUMBER: "36"
  PRINTFLOW_AGENT_VERSION: "0.2.6"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "agent/python/**"
      - "agent/windows/**"
      - "frontend/**"
      - ".github/workflows/build-agent-windows.yml"
      - "requirements.txt"
      - "requirements-dev.txt"

jobs:
  build-windows-agent:
    runs-on: windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Executar testes automatizados
        shell: powershell
        run: |
          $env:PYTHONPATH = "${{ github.workspace }};${{ github.workspace }}/agent/python"
          python -m pytest -q agent/python/tests backend/tests

      - name: Validar frontend
        shell: powershell
        run: |
          Push-Location frontend
          npm ci
          npm run build
          Pop-Location

      - name: Validar scripts Windows
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem agent/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            throw "Foram encontrados erros nos scripts PowerShell."
          }

      - name: Validar compilacao do Agent
        shell: powershell
        run: |
          python -m py_compile agent/python/main.py
          python -m py_compile agent/python/config/settings.py
          python -m py_compile agent/python/core/service.py
          python -m py_compile agent/python/network_manager.py
          python -m py_compile agent/python/discovery_runner.py
          python -m py_compile agent/python/snmp/engine.py
          python -m py_compile agent/python/api/client.py

      - name: Gerar executável
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name PRINTFLOW-Agent `
            --paths agent/python `
            --hidden-import pysnmp `
            --hidden-import pysnmp.hlapi `
            --hidden-import pysnmp.hlapi.v3arch `
            --hidden-import pysnmp.hlapi.v3arch.asyncio `
            --collect-all pysnmp `
            --collect-submodules pysnmp `
            --collect-all pyasn1 `
            --collect-submodules pyasn1 `
            --hidden-import psutil `
            --hidden-import requests `
            --hidden-import config.settings `
            --hidden-import core.logger `
            --hidden-import core.scheduler `
            --hidden-import core.service `
            --hidden-import api.client `
            --hidden-import snmp.engine `
            --hidden-import snmp.oids `
          --hidden-import diagnostic_robot `
          --hidden-import intelligence `
          --hidden-import intelligence.printer_v3 `
            agent/python/main.py

      - name: Testar executável
        shell: powershell
        run: |
          & dist/PRINTFLOW-Agent.exe --help | Tee-Object -FilePath EXE-SMOKE-TEST.txt
          if ($LASTEXITCODE -ne 0) {
            throw "O executavel falhou no teste --help. Codigo: $LASTEXITCODE"
          }
          $help = Get-Content EXE-SMOKE-TEST.txt -Raw
          if ($help -notmatch "--network" -or $help -notmatch "--daemon") {
            throw "O executavel nao apresentou as opcoes obrigatorias."
          }

      - name: Montar pacote de teste
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item dist/PRINTFLOW-Agent.exe package/
          Copy-Item agent/windows/Executar-PRINTFLOW-Agent.bat package/
          Copy-Item agent/windows/INSTALAR-PRINTFLOW-Agent.bat package/
          Copy-Item agent/windows/Start-PRINTFLOW-Agent.ps1 package/
          Copy-Item agent/windows/Install-PRINTFLOW-Agent.ps1 package/
          Copy-Item agent/windows/Uninstall-PRINTFLOW-Agent.ps1 package/
          Copy-Item agent/windows/VALIDAR-PRINTFLOW-Build.bat package/
          Copy-Item agent/windows/Validar-PRINTFLOW-Build.ps1 package/
          Copy-Item agent/windows/README-TESTE.txt package/
          $exeHash = (Get-FileHash package/PRINTFLOW-Agent.exe -Algorithm SHA256).Hash
          @"
          PRINTFLOW BUILD VALIDATION
          Build: $env:PRINTFLOW_BUILD_NUMBER
          Version: $env:PRINTFLOW_AGENT_VERSION
          Commit: $env:GITHUB_SHA
          Automated tests: APPROVED
          Frontend build: APPROVED
          PowerShell syntax: APPROVED
          EXE smoke test: APPROVED
          EXE SHA256: $exeHash
          "@ | Set-Content package/BUILD-VALIDATION.txt -Encoding UTF8
          Compress-Archive `
            -Path package/* `
            -DestinationPath PRINTFLOW-Agent-Windows-Teste.zip
          $required = @(
            "PRINTFLOW-Agent.exe",
            "Executar-PRINTFLOW-Agent.bat",
            "INSTALAR-PRINTFLOW-Agent.bat",
            "Start-PRINTFLOW-Agent.ps1",
            "Install-PRINTFLOW-Agent.ps1",
            "Uninstall-PRINTFLOW-Agent.ps1",
            "VALIDAR-PRINTFLOW-Build.bat",
            "Validar-PRINTFLOW-Build.ps1",
            "BUILD-VALIDATION.txt",
            "README-TESTE.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path "package/$file")) {
              throw "Arquivo ausente no pacote: $file"
            }
          }
          New-Item -ItemType Directory -Force -Path package-check | Out-Null
          Expand-Archive PRINTFLOW-Agent-Windows-Teste.zip package-check -Force
          foreach ($file in $required) {
            if (-not (Test-Path "package-check/$file")) {
              throw "Arquivo ausente no ZIP final: $file"
            }
          }

      - name: Publicar pacote
        uses: actions/upload-artifact@v4
        with:
          name: PRINTFLOW-Agent-Windows-Build-${{ env.PRINTFLOW_BUILD_NUMBER }}
          path: PRINTFLOW-Agent-Windows-Teste.zip
          retention-days: 15
