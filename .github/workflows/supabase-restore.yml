name: PRINTFLOW Supabase Backup16 Reconcile

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGHOST: aws-0-ca-central-1.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres.glnmlfwtuqqngfiqsqow
      PGPASSWORD: ${{ secrets.PRINTFLOW_SUPABASE_DATABASE_PASSWORD }}
      PGSSLMODE: require
    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PGPASSWORD:-}" || { echo "::error::Missing Supabase DB secret"; exit 1; }
          echo "::add-mask::$PGPASSWORD"

      - name: Install PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Test Supabase authentication
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -A -t -v ON_ERROR_STOP=1 -c 'select current_database()')" = "postgres"

      - name: Download Backup 16
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const run_id = 35588036106;
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo, run_id, per_page: 100
            });
            const a = response.data.artifacts.find(x => x.name === "PRINTFLOW-DB-Backup-16" && !x.expired);
            if (!a) { core.setFailed("Backup 16 unavailable"); return; }
            const d = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: a.id, archive_format: "zip"
            });
            fs.writeFileSync("backup16.zip", Buffer.from(d.data));

      - name: Validate and extract source data
        shell: bash
        run: |
          set -euo pipefail
          mkdir src
          unzip -q backup16.zip -d src
          dump="$(find src -type f -name '*.dump' | head -1)"
          checksum="${dump}.sha256"
          test -s "$dump" && test -s "$checksum"
          test "$(awk '{print $1}' "$checksum")" = "$(sha256sum "$dump" | awk '{print $1}')"
          pg_restore --data-only --no-owner --no-privileges --file=source.sql "$dump"
          test -s source.sql

      - name: Reconcile historical tables exactly from Backup 16
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^COPY public\.printer_usage_daily / {keep=1}
            /^COPY public\.operational_alerts / {keep=1}
            keep {print}
            keep && /^\\\.$/ {keep=0}
          ' source.sql > historical.sql
          grep -q '^COPY public.printer_usage_daily ' historical.sql
          grep -q '^COPY public.operational_alerts ' historical.sql

          {
            echo 'BEGIN;'
            echo 'TRUNCATE TABLE public.operational_alerts, public.printer_usage_daily RESTART IDENTITY;'
            cat historical.sql
            cat <<'SQL'
          SELECT setval(pg_get_serial_sequence('public.printer_usage_daily','id'),
                        (SELECT max(id) FROM public.printer_usage_daily), true);
          SELECT setval(pg_get_serial_sequence('public.operational_alerts','id'),
                        (SELECT max(id) FROM public.operational_alerts), true);
          COMMIT;
          SQL
          } > reconcile.sql
          psql -X -v ON_ERROR_STOP=1 -f reconcile.sql

      - name: Validate exact counts and integrity
        shell: bash
        run: |
          set -euo pipefail
          usage="$(psql -X -A -t -v ON_ERROR_STOP=1 -c 'select count(*) from public.printer_usage_daily')"
          usage_ids="$(psql -X -A -t -v ON_ERROR_STOP=1 -c 'select count(distinct id) from public.printer_usage_daily')"
          alerts="$(psql -X -A -t -v ON_ERROR_STOP=1 -c 'select count(*) from public.operational_alerts')"
          orphan_usage="$(psql -X -A -t -v ON_ERROR_STOP=1 -c 'select count(*) from public.printer_usage_daily u left join public.printers p on p.id=u.printer_id where p.id is null')"
          orphan_alerts="$(psql -X -A -t -v ON_ERROR_STOP=1 -c 'select count(*) from public.operational_alerts a left join public.companies_v2 c on c.id=a.company_id where c.id is null')"
          echo "usage=$usage ids=$usage_ids alerts=$alerts orphan_usage=$orphan_usage orphan_alerts=$orphan_alerts"
          test "$usage" = "497"
          test "$usage_ids" = "497"
          test "$alerts" = "145"
          test "$orphan_usage" = "0"
          test "$orphan_alerts" = "0"
