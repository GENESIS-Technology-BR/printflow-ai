name: TALVOA Render Backup Authentication Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: supritech-homolog-audit
    steps:
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
      - name: Validate read-only PostgreSQL connection
        env:
          DATABASE_URL: ${{ secrets.SUPRITECH_AUDIT_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '8'
          PGSSLMODE: require
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Secret SUPRITECH_AUDIT_DATABASE_URL is missing; no connection attempted."
            exit 1
          fi
          # Avoid exposing connection strings, identities or customer data in logs.
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc \
            "SELECT CASE WHEN current_setting('transaction_read_only') IN ('on','off') THEN 'CONNECTED' ELSE 'INVALID' END" \
            | grep -qx CONNECTED
          echo "PostgreSQL authentication succeeded. No data exported."
