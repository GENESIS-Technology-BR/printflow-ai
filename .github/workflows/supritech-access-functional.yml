name: TALVOA SupriTech authorization functional tests

on:
  push:
    branches:
      - test/supritech-functional-access-gates
  pull_request:
    paths:
      - 'backend/modules/partners/**'
      - 'backend/modules/auth/**'
      - 'backend/modules/companies/**'
      - 'tests/test_supritech_access_gates.py'
      - 'tests/test_supritech_access_sqlite.py'
      - 'tests/test_supritech_http_auth.py'
      - 'tests/test_supritech_real_login_router.py'
      - 'tests/test_supritech_partner_scoping.py'
      - '.github/workflows/supritech-access-functional.yml'

permissions:
  contents: read

jobs:
  tenant-access:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: sqlite:///./supritech-functional-ci.db
      SECRET_KEY: synthetic-ci-only-do-not-use-in-production-0123456789
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install 'fastapi>=0.110,<1' 'sqlalchemy>=2,<3' 'pydantic>=2,<3' 'pydantic-settings>=2,<3' 'psycopg2-binary>=2,<3' 'python-dotenv>=1,<2' 'PyJWT>=2,<3' 'httpx>=0.27,<1' 'email-validator>=2,<3'
      - name: Run synthetic authorization cases (mocked and real SQLite)
        run: |
          python -m unittest discover -s tests -p test_supritech_access_gates.py -v
          python -m unittest discover -s tests -p test_supritech_access_sqlite.py -v
          python -m unittest discover -s tests -p test_supritech_http_auth.py -v
          python -m unittest discover -s tests -p test_supritech_real_login_router.py -v
          python -m unittest discover -s tests -p test_supritech_partner_scoping.py -v
