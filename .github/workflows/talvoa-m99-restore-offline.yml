name: TALVOA Mission 99 Restore Offline Safety
on:
  push:
    branches:
      - ops/supritech-encrypted-backup-99
    paths:
      - 'ops/talvoa_m99_restore_local.py'
      - 'tests/test_m99_restore_safety_offline.py'
      - '.github/workflows/talvoa-m99-restore-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline cryptography dependency
        run: python -m pip install 'cryptography>=42,<48'
      - name: Compile Python files
        run: python -m compileall -q ops/talvoa_m99_restore_local.py ops/talvoa_secure_backup_windows.py ops/talvoa_decrypt_backup_windows.py
      - name: Execute offline restore safety tests
        run: python -m unittest discover -s tests -p 'test_m99_restore_safety_offline.py' -v
