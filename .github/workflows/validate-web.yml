name: PRINTFLOW Web Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/**"
      - "perf/**"
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/production_smoke.py"
      - ".github/workflows/validate-web.yml"
      - "requirements.txt"
      - "requirements-dev.txt"

permissions:
  contents: read

concurrency:
  group: printflow-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias Python
        run: pip install -r requirements-dev.txt

      - name: Testes backend
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/agent/python
        run: python -m pytest -q backend/tests

      - name: Homologacao funcional critica
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/agent/python
        run: |
          python -m pytest -q \
            backend/tests/test_security_hardening.py \
            backend/tests/test_tenant_isolation_contract.py \
            backend/tests/test_usage_multitenancy.py \
            backend/tests/test_dashboard_executive_clean.py \
            backend/tests/test_organization_catalog.py \
            backend/tests/test_organization_crud.py \
            backend/tests/test_printer_data_policy.py \
            backend/tests/test_printer_identity_fields.py \
            backend/tests/test_printer_organization.py \
            backend/tests/test_printer_organization_links.py \
            backend/tests/test_printer_usage_history.py \
            backend/tests/test_usage_report_scope.py \
            backend/tests/test_usage_reporting_exports.py

      - name: Gate de seguranca Python
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Gate de seguranca frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline
          npm audit --audit-level=high

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Resumo
        if: always()
        run: |
          {
            echo "## PRINTFLOW Web Validation #${{ github.run_number }}"
            echo "- Status: **${{ job.status }}**"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
