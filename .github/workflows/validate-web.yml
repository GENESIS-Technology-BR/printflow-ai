name: PRINTFLOW Web Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/validate-web.yml"
      - "requirements.txt"
      - "requirements-dev.txt"

permissions:
  contents: read

concurrency:
  group: printflow-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias Python
        run: pip install -r requirements-dev.txt

      - name: Testes backend
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/agent/python
        run: python -m pytest -q backend/tests

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Resumo
        if: always()
        run: |
          {
            echo "## PRINTFLOW Web Validation #${{ github.run_number }}"
            echo "- Status: **${{ job.status }}**"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
