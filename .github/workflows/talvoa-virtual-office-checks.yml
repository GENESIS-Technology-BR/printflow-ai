name: TALVOA Virtual Office Checks
on:
  push:
    branches: [feature/partner-multitenancy]
    paths:
      - 'ops/virtual-office/**'
      - '.github/workflows/talvoa-virtual-office-checks.yml'
  pull_request:
    paths:
      - 'ops/virtual-office/**'
      - '.github/workflows/talvoa-virtual-office-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and robot interaction contract
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('ops/virtual-office/index.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/);
          assert(script,'Inline JavaScript not found');
          new vm.Script(script[1],{filename:'talvoa-virtual-office.js'});
          for(const marker of ['data-station','showStation','robotDetails','office','detailBody','safeRunUrl','statusFilter']){
            assert(html.includes(marker),'Missing robot interaction element: '+marker);
          }
          assert(html.includes('role="button"'),'Keyboard-accessible station missing');
          assert(html.includes('tabindex="0"'),'Focus support missing');
          const liveRender=script[1].match(/el\('office'\)\.innerHTML=groups\.map\(\(\[name,workflow\],i\)=>\{([\s\S]*?)\}\)\.join\(''\)/);
          assert(liveRender,'Live robot rendering function missing');
          assert(liveRender[1].includes('<details class=') && liveRender[1].includes('<summary class='),'Live robot cards must expose native clickable details');
          assert(liveRender[1].includes('native-details'),'Live robot cards must expose a details body');
          console.log('Virtual office JavaScript syntax and interaction contract: PASS');
          NODE
