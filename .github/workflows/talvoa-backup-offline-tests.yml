name: TALVOA SupriTech Backup Offline Safety
on:
  pull_request:
    branches: [feature/partner-multitenancy]
    paths:
      - 'ops/talvoa_*backup_windows.py'
      - 'tests/test_supritech_backup_*_offline.py'
      - '.github/workflows/talvoa-backup-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptography (no DB clients, no credentials)
        run: python -m pip install 'cryptography>=42,<48'
      - name: Check source syntax
        run: python -m compileall -q ops/talvoa_secure_backup_windows.py ops/talvoa_decrypt_backup_windows.py
      - name: Run synthetic-only unit tests
        run: python -m unittest discover -s tests -p 'test_supritech_backup_*_offline.py' -v
