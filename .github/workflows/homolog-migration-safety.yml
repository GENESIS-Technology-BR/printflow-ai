name: Homolog migration safety

on:
  push:
    branches: [feature/partner-multitenancy]
    paths:
      - 'backend/scripts/migrate_supritech_homolog_structure.py'
      - 'tests/test_homolog_migration_safety.py'
      - '.github/workflows/homolog-migration-safety.yml'
  workflow_dispatch:

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static migration safety checks (no database)
        run: python -m unittest discover -s tests -p 'test_homolog_migration_safety.py' -v
