name: TALVOA Pilot Agent Reliability Checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/pilot/**'
      - '.github/workflows/talvoa-pilot-agent-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heartbeat-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test Agent heartbeat freshness policy
        run: python3 -m unittest discover -s ops/pilot -p 'test_heartbeat_policy.py' -v
