name: TALVOA Pilot Agent Reliability Checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/pilot/**'
      - 'backend/modules/dashboard/**'
      - 'backend/tests/test_dashboard_operational_status.py'
      - 'frontend/src/components/Dashboard.tsx'
      - 'frontend/src/services/api.ts'
      - '.github/workflows/talvoa-pilot-agent-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heartbeat-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test Agent heartbeat freshness policy
        run: python3 -m unittest discover -s ops/pilot -p 'test_*.py' -v
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
  backend-operational-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Test dashboard operational endpoint
        run: python -m unittest discover -s backend/tests -p 'test_dashboard_operational_status.py' -v
