name: TALVOA SupriTech Migration Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate migration tools
        run: |
          python -m unittest discover -s backend/tests -p 'test_supritech_migration_runner.py' -v
          python -m py_compile backend/scripts/talvoa_supritech_inventory.py backend/scripts/talvoa_supritech_verify_restore.py
      - name: Check migration secret configuration without printing values
        env:
          SOURCE: ${{ secrets.TALVOA_SOURCE_DATABASE_URL }}
          TARGET: ${{ secrets.TALVOA_TARGET_DATABASE_URL }}
        run: |
          if [ -z "$SOURCE" ] || [ -z "$TARGET" ]; then
            echo "::warning::Migration secrets are not configured. No connection attempted."
            exit 0
          fi
          echo "Migration secret names configured; no connections attempted."
      - name: Confirm no migration ran
        run: |
          test ! -e supritech-homolog.dump
          echo "PASS: offline preflight only. No dump, restore, or cutover."
