name: TALVOA Robot Tenant Policy Tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/robot-plans/tenant_policy_reference.py'
      - 'ops/robot-plans/test_tenant_policy.py'
      - 'ops/robot-plans/inventory_tenant_endpoints.py'
      - '.github/workflows/talvoa-robot-tenant-policy-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tenant-policy-unit-tests:
    name: Tenant isolation reference tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated tenant policy unit tests
        run: python3 -m unittest discover -s ops/robot-plans -p 'test_tenant_policy.py' -v
      - name: Generate tenant endpoint inventory
        run: |
          python3 ops/robot-plans/inventory_tenant_endpoints.py > tenant-endpoint-inventory.md
          cat tenant-endpoint-inventory.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload inventory for human review
        uses: actions/upload-artifact@v4
        with:
          name: talvoa-tenant-endpoint-inventory
          path: tenant-endpoint-inventory.md
          retention-days: 7
