name: TALVOA Render Backup Network Preflight

on:
  push:
    branches:
      - feature/partner-multitenancy
    paths:
      - '.github/workflows/render-backup-network-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify outbound TLS and TCP connectivity without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import socket, ssl
          host = "dpg-db7rsb25b2lc739g0img-a.oregon-postgres.render.com"
          port = 5432
          print("Checking TCP reachability to Render PostgreSQL (no credentials).")
          try:
              with socket.create_connection((host, port), timeout=8) as conn:
                  conn.settimeout(8)
                  conn.sendall(b"\x00\x00\x00\x08\x04\xd2\x16\x2f")
                  response = conn.recv(1)
                  if response == b"S":
                      print("PostgreSQL TLS negotiation: supported.")
                  elif response == b"N":
                      raise RuntimeError("Server rejected PostgreSQL TLS negotiation.")
                  else:
                      raise RuntimeError("Unexpected PostgreSQL SSL negotiation response.")
          except Exception as exc:
              print(f"Connectivity check failed: {type(exc).__name__}: {exc}")
              raise SystemExit(1)
          print("Preflight PASS: TCP and TLS negotiation work.")
          print("IMPORTANT: this does not validate database allowlist, authentication, dump, or restore.")
          PY
