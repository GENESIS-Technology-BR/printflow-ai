name: TALVOA Robotic Operations Read-Only
on:
  push:
    paths:
      - '.github/workflows/talvoa-robot-readonly.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 12,15,18,21 * * 1-5'
permissions:
  contents: read
  actions: read
concurrency:
  group: talvoa-robot-readonly
  cancel-in-progress: true
jobs:
  robot-development:
    name: Desenvolvimento
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source
        run: |
          echo "### Desenvolvimento" >> "$GITHUB_STEP_SUMMARY"
          echo "Arquivos Python: $(find . -type f -name '*.py' -not -path './.git/*' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
  robot-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect deployment definitions
        run: |
          echo "### Deploy (somente leitura)" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflows: $(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" >> "$GITHUB_STEP_SUMMARY"
  robot-database:
    name: Banco de dados
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect migration files without DB connection
        run: |
          echo "### Banco de dados (sem conexão)" >> "$GITHUB_STEP_SUMMARY"
          echo "Migrações candidatas: $(find . -type f -iname '*migration*.py' -not -path './.git/*' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
  robot-security:
    name: Segurança
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Check suspicious code patterns
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,os
          files=[str(p) for p in pathlib.Path('.').rglob('*.py') if '.git' not in p.parts and ('eval(' in p.read_text(errors='ignore') or 'exec(' in p.read_text(errors='ignore'))]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(f'### Segurança (triagem textual, não auditoria)\nArquivos para revisão: {len(files)}\n')
          PY
  robot-monitoring:
    name: Monitoramento
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    steps:
      - name: Inspect GitHub Actions via API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh api "repos/$GH_REPOSITORY/actions/runs?per_page=10" --jq '.workflow_runs | length' | awk '{print "Execuções consultadas: "$1}' >> "$GITHUB_STEP_SUMMARY"
  robot-quality:
    name: Qualidade
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax without executing product code
        shell: bash
        run: |
          python3 - <<'PY'
          import ast,pathlib,os
          total=0;errors=[]
          for p in pathlib.Path('.').rglob('*.py'):
              if '.git' in p.parts or total>=500:continue
              try:ast.parse(p.read_text(encoding='utf-8-sig',errors='replace'),filename=str(p))
              except SyntaxError as e:errors.append(f'{p}:{e.lineno}')
              total+=1
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(f'### Qualidade\nArquivos verificados: {total}; erros de sintaxe: {len(errors)}\n')
          if errors:print('Erros:',*errors[:20],sep='\n');raise SystemExit(1)
          PY
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout for analysis only
        uses: actions/checkout@v4
      - name: Six robots - real read-only checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import os,json,urllib.request,datetime,subprocess,pathlib
          root=pathlib.Path('.')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          checks=[]
          def add(name,status,details):
              checks.append(dict(robot=name,status=status,details=details))
          py=list(root.rglob('*.py'))
          add('Desenvolvimento','observado',f'{len(py)} arquivos Python encontrados; nenhuma alteração realizada')
          workflows=list((root/'.github/workflows').glob('*.yml'))+list((root/'.github/workflows').glob('*.yaml'))
          add('Deploy','observado',f'{len(workflows)} definições de workflow; deploy NÃO executado')
          migrations=list(root.rglob('*migration*.py'))
          add('Banco de dados','observado',f'{len(migrations)} arquivos de migração identificados; banco NÃO acessado')
          risky=[]
          for p in py[:400]:
              try:
                  t=p.read_text(encoding='utf-8',errors='ignore')
                  if 'eval(' in t or 'exec(' in t:risky.append(str(p))
              except OSError:pass
          add('Segurança','atenção' if risky else 'observado',f'{len(risky)} arquivos com eval/exec em inspeção textual (não é auditoria de segurança)')
          repo=os.environ['GH_REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/actions/runs?per_page=30'
          try:
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'talvoa-readonly'})
              with urllib.request.urlopen(req,timeout=15) as response:
                  runs=json.load(response).get('workflow_runs',[])
              latest=[{'name':r.get('name'),'status':r.get('status'),'conclusion':r.get('conclusion')} for r in runs[:12]]
              add('Monitoramento','observado',f'{len(runs)} execuções consultadas via API GitHub')
          except Exception as exc:
              latest=[]
              add('Monitoramento','indisponível',f'API GitHub: {type(exc).__name__}')
          add('Qualidade','observado','Relatório gerado; testes de produto não foram executados')
          recommendations=[]
          if risky:recommendations.append({'robot':'Segurança','priority':'revisar','action':'Revisar manualmente chamadas eval/exec encontradas; não executar correção automática','files':risky[:20]})
          if not migrations:recommendations.append({'robot':'Banco de dados','priority':'informativo','action':'Nenhum arquivo de migração por nome localizado; conferir versionamento do esquema'})
          if not workflows:recommendations.append({'robot':'Deploy','priority':'revisar','action':'Nenhum workflow encontrado; verificar CI/CD'})
          output={'generated_at_utc':now,'mode':'read_only','robots':checks,'recent_workflows':latest,'recommendations':recommendations,'metrics':{'python_files':len(py),'workflow_definitions':len(workflows),'migration_files':len(migrations),'security_pattern_files':len(risky),'github_runs_checked':len(latest)}}
          pathlib.Path('reports/talvoa-robots.json').write_text(json.dumps(output,ensure_ascii=False,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## TALVOA - 6 robôs (somente leitura)\n\n')
              for c in checks:f.write(f"- **{c['robot']}**: {c['status']} — {c['details']}\n")
          PY
      - name: Publish inspection report
        uses: actions/upload-artifact@v4
        with:
          name: talvoa-robot-readonly-report
          path: reports/talvoa-robots.json
          retention-days: 7
